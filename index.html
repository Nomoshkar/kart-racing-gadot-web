<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#070810">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Gadot Kart Racing">
		<link rel="manifest" href="manifest.webmanifest">
		<title>Gadot Kart Racing</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

html, body {
	background: #070810;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	position: fixed;
	inset: 0;
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	top: 0;
	bottom: 0;
	background:
		radial-gradient(ellipse at 50% 42%, #33203f 0%, #12121f 45%, #06070d 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

#status-title {
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	font-weight: 800;
	letter-spacing: 0.10em;
	font-size: clamp(26px, 6vw, 54px);
	color: #ffd23c;
	text-shadow: 0 3px 0 #6b3b0a, 0 0 30px rgba(255, 196, 40, 0.35);
	margin-bottom: 6px;
	text-align: center;
}

#status-sub {
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	font-size: clamp(12px, 2.2vw, 18px);
	letter-spacing: 0.24em;
	color: #8fd4ff;
	margin-bottom: 26px;
	text-align: center;
}

#status-start {
	appearance: none;
	border: 0;
	border-radius: 999px;
	padding: 18px 54px;
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	font-weight: 800;
	font-size: clamp(16px, 3vw, 22px);
	letter-spacing: 0.12em;
	color: #171129;
	background: linear-gradient(180deg, #ffe066 0%, #ffb300 100%);
	box-shadow: 0 6px 0 #8a4d00, 0 12px 34px rgba(255, 179, 0, 0.35);
	cursor: pointer;
}

#status-start:active {
	transform: translateY(3px);
	box-shadow: 0 3px 0 #8a4d00;
}

#status-hint {
	margin-top: 22px;
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	font-size: 13px;
	line-height: 1.5;
	color: rgba(220, 228, 245, 0.62);
	max-width: 32rem;
	padding: 0 20px;
	text-align: center;
}

#status-progress {
	bottom: 12%;
	width: min(52%, 420px);
	margin: 0 auto;
	height: 10px;
	accent-color: #ffc21a;
}

#status-notice {
	background-color: #2a1a22;
	border-radius: 0.6rem;
	border: 1px solid #9b3943;
	color: #f0dada;
	font-family: system-ui, sans-serif;
	line-height: 1.4;
	margin: 0 1.2rem;
	max-width: 42rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#rotate-hint {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 20;
	background: #070810;
	color: #dfe6f5;
	font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	text-align: center;
	padding: 24px;
}

#rotate-hint .phone {
	width: 54px;
	height: 92px;
	border: 3px solid #ffd23c;
	border-radius: 10px;
	animation: turn 2.2s ease-in-out infinite;
}

@keyframes turn {
	0%, 30% { transform: rotate(0deg); }
	55%, 100% { transform: rotate(90deg); }
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate-hint { display: flex; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="rotate-hint">
			<div class="phone"></div>
			<div>Rotate to landscape to race</div>
		</div>

		<div id="status">
			<div id="status-title">GADOT KART RACING</div>
			<div id="status-sub">ARCADE RACING</div>
			<button id="status-start" type="button">TAP TO START</button>
			<progress id="status-progress" value="0" max="1"></progress>
			<div id="status-notice"></div>
			<div id="status-hint">
				Phone: hold GAS, steer by dragging anywhere on the left, DRIFT through corners.<br>
				Keyboard: WASD / arrows, Space to drift, E for items.
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":55323768,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const startButton = document.getElementById('status-start');

	let initializing = true;
	let statusMode = '';
	let started = false;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.visibility = 'hidden';
			statusOverlay.style.display = 'none';
			statusProgress.style.display = 'none';
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		startButton.style.display = 'none';
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function enterFullscreen() {
		const el = document.documentElement;
		const request = el.requestFullscreen || el.webkitRequestFullscreen;
		if (request) {
			try {
				const p = request.call(el);
				if (p && p.then) {
					p.then(() => {
						if (screen.orientation && screen.orientation.lock) {
							screen.orientation.lock('landscape').catch(() => {});
						}
					}).catch(() => {});
				}
			} catch (e) {
				// iOS Safari and desktop browsers that refuse fullscreen: the game
				// still runs, just with browser chrome around it.
			}
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'This browser is missing features Godot needs to run:\n' + missing.join('\n') +
			'\n\nPlease update Chrome, Edge, Firefox or Safari.';
		displayFailureNotice(missingMsg);
		return;
	}

	startButton.addEventListener('click', () => {
		if (started) {
			return;
		}
		started = true;
		enterFullscreen();
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.focus();
		}, displayFailureNotice);
	});

	statusOverlay.style.visibility = 'visible';
	document.getElementById('status-title').addEventListener('click', () => startButton.click());
})();
		</script>
	</body>
</html>
